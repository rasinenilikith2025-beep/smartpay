<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartPay: Payment Pipeline Hazard Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2447;--royal:#1d4ed8;--blue:#2563eb;--sky:#e8f0ff;--bg:#f4f6fb;--card:#fff;--line:#e2e8f3;
  --text:#0f1b33;--muted:#5a6a85;--green:#12a150;--green-bg:#e6f6ec;--red:#d92d3f;--red-bg:#fdecee;
  --amber:#b87400;--amber-bg:#fff3d6;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--navy);letter-spacing:-.01em}
h2{font-size:18px}h3{font-size:16px}
p{margin:0 0 10px}
a{color:var(--royal)}
:focus-visible{outline:3px solid #93b4ff;outline-offset:2px;border-radius:6px}
.sm{font-size:13px}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:10px}
.ic{flex:none;vertical-align:middle}

/* layout */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--navy);color:#b9c8e8;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:40;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:4px 8px 20px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#b9c8e8;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:var(--blue);color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:#8ea3cc;padding:10px 8px}
.scrim{display:none}
.main{margin-left:248px;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px}
.btn.menu-btn{display:none}
.short{display:none}
.topbar .row{gap:6px;min-width:0}
.content{padding:24px;max-width:1200px;margin:0 auto}
.page-head{margin-bottom:18px}
.page-head h1{font-size:26px;margin-bottom:4px}
.page-head p{color:var(--muted);margin:0}
@media (max-width:900px){
  .side{transform:translateX(-100%)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(11,36,71,.45);z-index:35}
  .main{margin-left:0}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding:10px 12px}
  .long{display:none}.short{display:inline}
  .btn.menu-btn{padding:8px 10px}
  .content{padding:16px}
}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(15,27,51,.04),0 6px 20px rgba(15,27,51,.05)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:#f1f5fd;border-color:#cdd9ef}
.btn.primary{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.primary:hover{background:#1e40af}
.btn.danger{color:var(--red);border-color:#f3c3c8}
.btn.danger:hover{background:var(--red-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f7;color:#43516b;white-space:nowrap}
.b-green{background:var(--green-bg);color:#0a6b35}.b-red{background:var(--red-bg);color:#a11c2b}
.b-amber{background:var(--amber-bg);color:#7a4d00}.b-blue{background:var(--sky);color:#173a9c}
.notice{background:var(--sky);border:1px solid #bcd0fb;color:#16348c;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{padding:16px}
.stat .l{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.stat .v{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px}
.stat .u{font-size:13px;font-weight:500;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #eef2f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13.5px}
input[type=text],input[type=number],input[type=search],select{font:inherit;padding:10px 12px;border:1px solid #cbd6ea;border-radius:10px;background:#fff;color:var(--text);width:100%}
select.inl{width:auto;padding:8px 10px}
.form-msg{min-height:22px;font-size:14px;margin-bottom:10px}
.form-msg.err{color:var(--red);font-weight:600}.form-msg.ok{color:#0a6b35;font-weight:600}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.ctl{margin:12px 0 4px;align-items:center}
.ctl label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.acc{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f9;font-size:14px}
.acc:last-child{border-bottom:0}
.log{max-height:260px;overflow:auto;font-size:13.5px;margin:0;padding:0;list-style:none}
.log li{padding:7px 0;border-bottom:1px solid #eef2f9;display:flex;gap:10px}
.log .c{color:var(--muted);min-width:64px;font-variant-numeric:tabular-nums}

/* pipeline */
.pipe{position:relative}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;position:relative;transition:border-color .25s,background .25s}
.col:not(:last-child) .stage::after{content:"";position:absolute;right:-11px;top:50%;width:8px;height:8px;border-top:2px solid #b8c6e2;border-right:2px solid #b8c6e2;transform:translateY(-50%) rotate(45deg)}
.stage-h{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;color:var(--navy)}
.stage p{margin:6px 0 8px;color:var(--muted);font-size:12px;line-height:1.35}
.stage-state{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef1f7;color:#52617c}
.col.s-active .stage{border-color:var(--blue);background:#f3f7ff}.col.s-active .stage-state{background:var(--sky);color:#173a9c}
.col.s-stalled .stage{border-color:#e8b84d;background:#fffaf0}.col.s-stalled .stage-state{background:var(--amber-bg);color:#7a4d00}
.col.s-error .stage{border-color:#ec8793;background:#fff6f7}.col.s-error .stage-state{background:var(--red-bg);color:#a11c2b}
.col.s-done .stage{border-color:#7fd0a1;background:#f4fcf7}.col.s-done .stage-state{background:var(--green-bg);color:#0a6b35}
.zones{display:flex;flex-direction:column;gap:8px}
.zone{position:relative;border-radius:12px;background:#f7f9fd;border:1px solid #e8edf7}
.zone.side{background:transparent;border:1.5px dashed #cdd7ea}
.zone.side::before{content:"Waiting or redirected";position:absolute;left:8px;top:3px;font-size:10px;color:#8a97ae}
.pipe.vertical .cols{grid-template-columns:1fr}
.pipe.vertical .col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px;align-items:stretch}
.pipe.vertical .zones{flex-direction:row}
.pipe.vertical .zone{flex:1;min-width:0}
.pipe.vertical .stage::after{display:none}
.pipe.vertical .zone.side::before{content:"Waiting"}
.pipe.compact .stage{padding:8px}
.pipe.compact .stage-h{font-size:11.5px}
.pipe.compact .stage-h .ic{display:none}
.pipe.compact .cols{gap:8px}
.pipe.compact .col:not(:last-child) .stage::after{display:none}
.pipe.compact .zone.side::before{content:"Waiting";}
.tok-layer{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;left:0;top:0;height:30px;display:flex;align-items:center;padding:0 9px;border-radius:9px;font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid;
  transition:transform .6s cubic-bezier(.4,.1,.2,1),width .3s,opacity .4s,background-color .3s}
.t-processing{background:var(--sky);border-color:#9db9f5;color:#173a9c}
.t-stalled{background:var(--amber-bg);border-color:#efc56a;color:#7a4d00}
.t-completed{background:var(--green-bg);border-color:#8fd3ab;color:#0a6b35}
.t-rejected,.t-hazard{background:var(--red-bg);border-color:#f0a3ab;color:#9c1c2b}
.t-hazard{box-shadow:0 0 0 2px rgba(217,45,63,.18)}
.t-queued{background:#eef1f7;border-color:#cdd5e4;color:#43516b}

/* lab */
.lab-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.hz{display:flex;flex-direction:column;gap:6px}
.hz .btn{align-self:flex-start;margin-top:auto}
.hz.sel{border-color:var(--blue);box-shadow:0 0 0 3px #dbe7ff}
.hz .scn{font-size:13.5px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:1000px){.cmp{grid-template-columns:1fr}}
.panel-bad{border-top:4px solid var(--red)}.panel-good{border-top:4px solid var(--green)}
.event{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f6f8fd;border:1px solid var(--line);min-height:46px;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:12px}
.m{background:#f6f8fd;border-radius:10px;padding:10px}
.m b{display:block;font-size:18px;color:var(--navy)}.m span{font-size:12px;color:var(--muted)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.info-grid .card{padding:16px}
.info-grid h3{margin-bottom:6px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#5a6a85}.chart .val{font-weight:600;fill:#0f1b33}
.bar{height:10px;background:#eaf0fb;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}

/* learn / quiz / modal */
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.learn .card{padding:18px}.learn h3{margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font:inherit;cursor:pointer;margin-bottom:8px;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-bg)}.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt:disabled{cursor:default}
.modal{position:fixed;inset:0;background:rgba(11,36,71,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal[hidden]{display:none}
.sheet{background:#fff;border-radius:16px;max-width:660px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.steps{list-style:none;margin:0;padding:0;border-left:2px solid #d5e0f5}
.steps li{padding:0 0 12px 14px;position:relative;font-size:14px}
.steps li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Main navigation">
  <div class="brand"><span class="logo" id="logo"></span><span>SmartPay</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">Simulated data only. No real money, cards or bank details are used.</div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="topbar">
    <div class="row">
      <button class="btn menu-btn" id="menu-btn" data-act="menu" aria-label="Open navigation"></button>
      <span class="badge b-blue" id="top-notice"><span class="long">Educational simulation only</span><span class="short">Simulation only</span></span>
    </div>
    <div class="row">
      <span class="badge" id="top-cycle">Cycle 0</span>
      <span class="badge" id="top-state">Paused</span>
    </div>
  </header>
  <main class="content" id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="sheet"></div>
</div>

<script>
'use strict';
/* =====================================================================
   SmartPay: Payment Pipeline Hazard Simulator
   Sections: helpers, engine, lab builders, renderer, pages, router
   Educational simulation only. No real money moves anywhere.
   ===================================================================== */

/* ------------------------------ helpers ------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => (n < 0 ? '-' : '') + '\u20B9' + Math.abs(n).toLocaleString('en-IN');

const ICONS = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  flask:'<path d="M10 2v7.5L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5L14 9.5V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  hist:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  step:'<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/>',
  reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  menu:'<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  swap:'<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  done:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  ok:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  list:'<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>'
};
const icon = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/*ENGINE-START*/
/* ------------------------------ engine ------------------------------ */
const STAGES = [
  {short:'Initiation', name:'Payment initiation', icon:'send', dur:1, desc:'Amount and recipient captured; a transaction ID is generated.'},
  {short:'Validation', name:'Validation and authentication', icon:'shield', dur:2, desc:'Details validated and the sender authenticated.'},
  {short:'Balance check', name:'Balance verification', icon:'wallet', dur:1, desc:'Sender balance verified against committed funds only.'},
  {short:'Debit & credit', name:'Debit and credit processing', icon:'swap', dur:1, desc:'Sender debited and recipient credited as one atomic step.'},
  {short:'Confirmation', name:'Confirmation and receipt', icon:'done', dur:1, desc:'Final status shown with a receipt or the rejection reason.'}
];
const ACC0 = {'Aarav Sharma':25000,'Diya Patel':18500,'Rohan Mehta':9200,'Meera Iyer':42000,'Kabir Singh':6400};
const NAMES = Object.keys(ACC0);
const RISK_LIMIT = 50000;
const KEY = 'smartpay-sim-v1';
const SPEEDS = {slow:1100, normal:700, fast:350};

function freshS(){
  return {cycle:0, accounts:Object.assign({}, ACC0), txs:[], queue:[], locks:{}, nextId:1001, seq:0, batch:0,
          stageBusy:[0,0,0,0,0], completions:[], log:[]};
}
let S = Object.assign(freshS(), {units:2, speed:SPEEDS.normal, running:false, timer:null});

function addLog(text, kind){ S.log.unshift({cycle:S.cycle, text, kind:kind || 'info'}); if (S.log.length > 120) S.log.pop(); }
function hist(t, stage, text){ t.hist.push({cycle:S.cycle, stage, text}); }
function addHaz(t, h){ if (!t.hazards.includes(h)) t.hazards.push(h); }
function addMit(t, m){ if (!t.mitigation.includes(m)) t.mitigation.push(m); }
const cap = s => s === 0 ? 3 : (s === 1 ? S.units : 1);
const inStage = s => S.txs.filter(t => t.stage === s).sort((a, b) => a.enter - b.enter);
const active = () => S.txs.filter(t => t.stage >= 0 || t.status === 'Queued');

function newTx(p){
  const n = S.nextId++;
  const t = {id:'TX-' + n, n, sender:p.sender, recipient:p.recipient, amount:p.amount, ref:p.ref, scenario:p.scenario || 'none',
    key:[p.sender, p.recipient, p.amount, String(p.ref).trim().toLowerCase()].join('|'),
    status:'Queued', stage:-1, left:0, enter:0, stalls:0, stalling:false, hazards:[], mitigation:[], reason:'', hist:[],
    submitted:S.cycle, finished:null, rejStage:null, authFail:!!p.authFail, ran:{}, receipt:null};
  S.txs.push(t); S.queue.push(t);
  hist(t, 'Submitted', 'Payment of ' + inr(t.amount) + ' from ' + t.sender + ' to ' + t.recipient + ' queued');
  return t;
}
function admit(){
  while (S.queue.length && inStage(0).length < cap(0)){
    const t = S.queue.shift();
    t.stage = 0; t.left = STAGES[0].dur; t.enter = S.seq++; t.status = 'Processing';
    hist(t, STAGES[0].short, 'Entered payment initiation; ID ' + t.id + ' generated');
  }
}
function release(t){ if (S.locks[t.sender] === t.id) delete S.locks[t.sender]; }
function reject(t, reason, hazard, mit){
  const at = t.stage < 0 ? 0 : t.stage;
  release(t);
  t.rejStage = at; t.stage = -2; t.status = 'Rejected'; t.reason = reason; t.finished = S.cycle; t.stalling = false;
  if (hazard) addHaz(t, hazard);
  if (mit) addMit(t, mit);
  hist(t, STAGES[at].short, 'Rejected: ' + reason);
  addLog(t.id + ' rejected. ' + reason, 'bad');
}
function complete(t){
  t.stage = -2; t.status = 'Completed'; t.finished = S.cycle; t.stalling = false;
  t.receipt = {id:t.id, amount:t.amount, from:t.sender, to:t.recipient, ref:t.ref, cycle:S.cycle};
  S.completions.push(S.cycle);
  hist(t, STAGES[4].short, 'Receipt issued. Payment completed');
  addLog(t.id + ' completed: ' + inr(t.amount) + ' to ' + t.recipient, 'ok');
}
function stall(t, s, kind){
  t.stalls++; t.status = 'Stalled'; addHaz(t, kind);
  const nxt = STAGES[s + 1].short.toLowerCase();
  if (kind === 'data') addMit(t, 'Account lock: this payment waited until the earlier debit on the same account committed');
  else addMit(t, 'Queued for a free ' + nxt + ' slot; adding capacity reduces this wait');
  if (!t.stalling){
    t.stalling = true;
    const why = kind === 'data' ? 'account is locked by an earlier payment' : 'next stage is full';
    hist(t, STAGES[s].short, 'Stalled: ' + why);
    addLog(t.id + ' stalled at ' + STAGES[s].short + ' (' + why + ')', 'warn');
  }
}
function finishStage(t, s){
  if (!t.ran[s]){
    t.ran[s] = true;
    if (s === 1){
      if (t.authFail) return reject(t, 'Authentication failed', 'control', 'Decision point redirected the payment to Rejected; balance, debit and confirmation stages were cancelled so nothing committed');
      if (t.amount > RISK_LIMIT) return reject(t, 'Risk check rejected: amount above the ' + inr(RISK_LIMIT) + ' demo limit', 'control', 'Decision point redirected the payment to Rejected before any balance was touched');
      hist(t, STAGES[1].short, 'Validation and authentication passed');
    } else if (s === 2){
      const bal = S.accounts[t.sender];
      if (t.amount > bal){
        const was = t.hazards.includes('data');
        return reject(t, 'Insufficient funds: balance ' + inr(bal) + ' is below ' + inr(t.amount), null,
          was ? 'Fresh committed balance was read under the account lock, so approval on a stale balance was prevented' : '');
      }
      hist(t, STAGES[2].short, 'Balance ' + inr(bal) + ' verified; account locked for this payment');
    } else if (s === 3){
      S.accounts[t.sender] -= t.amount; S.accounts[t.recipient] += t.amount; release(t);
      hist(t, STAGES[3].short, 'Debited ' + inr(t.amount) + ' from ' + t.sender + ' and credited ' + t.recipient + ' atomically; lock released');
    } else if (s === 4){
      return complete(t);
    }
  }
  const ns = s + 1;
  if (ns === 2 && S.locks[t.sender] && S.locks[t.sender] !== t.id) return stall(t, s, 'data');
  if (inStage(ns).length >= cap(ns)) return stall(t, s, 'structural');
  if (ns === 2) S.locks[t.sender] = t.id;
  t.stage = ns; t.left = STAGES[ns].dur; t.enter = S.seq++; t.status = 'Processing'; t.stalling = false;
  hist(t, STAGES[ns].short, 'Entered ' + STAGES[ns].name.toLowerCase());
}
function step(){
  if (!active().length) return false;
  S.cycle++;
  for (let s = 4; s >= 0; s--){
    const list = inStage(s);
    if (list.length) S.stageBusy[s]++;
    for (const t of list){
      if (t.stage !== s) continue;
      if (t.left > 0) t.left--;
      if (t.left === 0) finishStage(t, s);
    }
  }
  admit();
  return true;
}
function submit(p){
  const amount = Number(p.amount);
  if (!p.sender || !p.recipient) return {ok:false, error:'Choose a sender and a recipient.'};
  if (!NAMES.includes(p.sender) || !NAMES.includes(p.recipient)) return {ok:false, error:'Unknown account.'};
  if (!Number.isFinite(amount) || amount <= 0) return {ok:false, error:'Amount must be greater than zero.'};
  if (!Number.isInteger(amount)) return {ok:false, error:'Enter a whole number of rupees.'};
  if (amount > 10000000) return {ok:false, error:'Amount is too large for this demo.'};
  if (p.sender === p.recipient) return {ok:false, error:'Sender and recipient must be different.'};
  const ref = String(p.ref || '').trim().slice(0, 40) || 'Payment';
  if (S.txs.length >= 400) return {ok:false, error:'History is full. Reset the simulation to continue.'};
  const scenario = p.scenario || 'none';
  const key = [p.sender, p.recipient, amount, ref.toLowerCase()].join('|');
  if (S.txs.some(t => t.key === key && t.status !== 'Rejected')){
    const t = newTx({sender:p.sender, recipient:p.recipient, amount, ref, scenario});
    S.queue.pop();
    t.stage = -2; t.status = 'Rejected'; t.rejStage = 0; t.finished = S.cycle;
    t.reason = 'Duplicate submission blocked: the same payment already exists';
    addMit(t, 'Idempotency check: a repeat of the same payment was not processed, so no duplicate debit');
    hist(t, STAGES[0].short, 'Rejected: ' + t.reason);
    addLog(t.id + ' blocked as a duplicate. Change the reference to send a new payment.', 'bad');
    return {ok:false, error:'Duplicate blocked: that exact payment is already in the history. Change the reference to send another one.', tx:t};
  }
  const made = [];
  if (scenario === 'data' && S.units < 2){ S.units = 2; addLog('Validation units set to 2 so both payments reach the balance check together.'); }
  if (scenario === 'structural' && S.units !== 1){ S.units = 1; addLog('Validation units set to 1 for the structural hazard demo.'); }
  made.push(newTx({sender:p.sender, recipient:p.recipient, amount, ref, scenario, authFail: scenario === 'control'}));
  if (scenario === 'data'){
    const bal = S.accounts[p.sender];
    const other = NAMES.find(n => n !== p.sender && n !== p.recipient) || p.recipient;
    const comp = bal > amount ? (bal - amount + 500) : Math.max(100, Math.round(bal / 2 / 100) * 100);
    made.push(newTx({sender:p.sender, recipient:other, amount:comp, ref:'Concurrent request (data hazard demo)', scenario}));
  }
  if (scenario === 'structural'){
    const others = NAMES.filter(n => n !== p.sender);
    made.push(newTx({sender:others[0], recipient:others[1], amount:250, ref:'Burst payment A (structural demo)', scenario}));
    made.push(newTx({sender:others[2], recipient:others[3], amount:400, ref:'Burst payment B (structural demo)', scenario}));
  }
  admit();
  return {ok:true, txs:made};
}

    S.units = [1,2,3].includes(d.units) ? d.units : 2;

    S.batch = Math.max(0, Math.floor(Number(d.batch) || 0));

    S.log = (Array.isArray(d.log) ? d.log : []).slice(0, 60).map(l => ({cycle:Number(l && l.cycle) || 0, text:str(l && l.text, 200), kind:['ok','bad','warn','info'].includes(l && l.kind) ? l.kind : 'info'}));

}

/* tokens for the animated pipeline (engine) */
function engineTokens(){
  const arr = [];
  S.txs.slice().sort((a, b) => a.n - b.n).forEach(t => {
    const label = '#' + t.n + ' \u00B7 ' + inr(t.amount), short = '#' + t.n;
    const recent = t.finished !== null && S.cycle - t.finished <= 2;
    if (t.status === 'Queued') arr.push({key:t.id, label, short, col:0, row:1, state:'queued', title:t.id + ' queued'});
    else if (t.stage >= 0) arr.push({key:t.id, label, short, col:t.stage, row:t.status === 'Stalled' ? 1 : 0, state:t.status === 'Stalled' ? 'stalled' : 'processing', title:t.id + ' ' + t.status});
    else if (recent && t.status === 'Completed') arr.push({key:t.id, label, short, col:4, row:0, state:'completed', title:t.id + ' completed'});
    else if (recent && t.status === 'Rejected') arr.push({key:t.id, label, short, col:t.rejStage, row:1, state:'rejected', title:t.id + ' rejected: ' + t.reason});
  });
  return arr;
}

/* lab frame builders (deterministic, no DOM) */
function metricsFrom(frames, opts){
  opts = opts || {};
  const n = frames.length - 1; let stalls = 0, maxQ = 0, busy = 0; const fin = {}, start = {};
  frames.forEach((f, i) => {
    let q = 0;
    f.tokens.forEach(t => {
      if (start[t.id] === undefined) start[t.id] = i;
      if (t.state === 'stall'){ stalls++; q++; }
      if (t.final && fin[t.id] === undefined) fin[t.id] = {at:i, t};
      if (opts.unitCol !== undefined && t.col === opts.unitCol && t.row === 0 && t.state === 'active') busy++;
    });
    maxQ = Math.max(maxQ, q);
  });
  const list = Object.values(fin);
  const lat = list.length ? list.reduce((a, x) => a + (x.at - start[x.t.id]), 0) / list.length : 0;
  const valid = list.filter(x => x.t.outcome === 'completed' && !x.t.wrong).length;
  return {cycles:n, stalls, avgLatency:lat, throughput:n ? valid / n : 0, valid,
    completed:list.filter(x => x.t.outcome === 'completed').length, rejected:list.filter(x => x.t.outcome === 'rejected').length,
    wrong:list.filter(x => x.t.wrong).length, maxQueue:maxQ, wasted:opts.wasted || 0,
    utilization:opts.units ? busy / (opts.units * n) : null};
}

function structFrames(u){
  const P = ['T1','T2','T3'].map(id => ({id, pos:0, wait:false, left:0, fin:false}));
  const frames = [];
  const snap = note => frames.push({note, balance:null, tokens:P.map(p => ({id:p.id, label:p.id + ' \u00B7 \u20B9' + (p.id === 'T1' ? '500' : p.id === 'T2' ? '700' : '900'),
    col:p.pos, row:p.wait ? 1 : 0, state:p.fin ? 'ok' : (p.wait ? 'stall' : 'active'), final:p.fin, outcome:p.fin ? 'completed' : undefined}))});
  snap('Three payments arrive together and all need the validation stage.');
  let guard = 0;
  while (P.some(p => !p.fin) && guard++ < 40){
    P.filter(p => p.pos === 3).forEach(p => { p.pos = 4; p.fin = true; });
    P.filter(p => p.pos === 2).forEach(p => { p.pos = 3; });
    P.filter(p => p.pos === 1 && !p.wait).forEach(p => { if (p.left > 1) p.left--; else p.pos = 2; });
    let free = u - P.filter(p => p.pos === 1 && !p.wait).length;
    P.filter(p => p.wait).forEach(p => { if (free > 0){ p.wait = false; p.pos = 1; p.left = 2; free--; } });
    P.filter(p => p.pos === 0 && !p.wait).forEach(p => { if (free > 0){ p.pos = 1; p.left = 2; free--; } else p.wait = true; });
    const w = P.filter(p => p.wait).map(p => p.id), v = P.filter(p => p.pos === 1 && !p.wait).map(p => p.id);
    let note;
    if (P.every(p => p.fin)) note = 'All three payments are confirmed.';
    else if (w.length) note = w.join(' and ') + ' must wait: ' + v.join(' and ') + (v.length > 1 ? ' are' : ' is') + ' using ' + (u === 1 ? 'the only validation unit.' : 'the validation units.');
    else if (v.length) note = v.join(' and ') + (v.length > 1 ? ' are' : ' is') + ' being validated.';
    else note = 'The remaining payments move through the later stages without contention.';
    snap(note);
  }
  return frames;
}

function pipeHTML(compact, id){

      <div class="zones"><div class="zone main" role="group" aria-label="${s.short}: in progress"></div><div class="zone side" role="group" aria-label="${s.short}: waiting or redirected"></div></div>
    </div>`).join('')}</div><div class="tok-layer"></div></div>`;
}
const PFX = {completed:'\u2713 ', rejected:'\u2715 ', hazard:'! ', stalled:'\u2016 ', queued:'\u25CB ', processing:''};
function layoutPipe(pipe, toks){
  if (!pipe) return;
  pipe._last = toks;
  const vertical = pipe.clientWidth > 0 && pipe.clientWidth < (pipe.classList.contains('compact') ? 430 : 700);
  pipe.classList.toggle('vertical', vertical);
  const cols = $$('.col', pipe), layer = $('.tok-layer', pipe);
  const chipH = 30, gap = 6, step = chipH + gap;
  const groups = {};
  toks.forEach(t => { (groups[t.col + '-' + t.row] = groups[t.col + '-' + t.row] || []).push(t); });
  cols.forEach((c, i) => [0, 1].forEach(r => {
    const z = $(r ? '.zone.side' : '.zone.main', c), arr = groups[i + '-' + r] || [];
    const zw = z.clientWidth || 100;
    const chipW = vertical ? 80 : Math.max(56, zw - 12);
    const per = vertical ? Math.max(1, Math.floor((zw - 10) / (chipW + gap))) : 1;
    const rows = Math.max(1, Math.ceil(arr.length / per)), off = r ? 18 : 8;
    z.style.minHeight = Math.max(vertical ? 58 : (r ? 64 : 112), off + rows * step + 6) + 'px';
    z._m = {chipW, per, off};
  }));
  const base = pipe.getBoundingClientRect();
  pipe._tok = pipe._tok || new Map();
  const seen = new Set();
  cols.forEach((c, i) => [0, 1].forEach(r => {
    const z = $(r ? '.zone.side' : '.zone.main', c), m = z._m, rect = z.getBoundingClientRect();
    (groups[i + '-' + r] || []).forEach((t, k) => {
      const x = rect.left - base.left + 6 + (k % m.per) * (m.chipW + gap);
      const y = rect.top - base.top + m.off + Math.floor(k / m.per) * step;
      let el = pipe._tok.get(t.key);
      if (!el){
        el = document.createElement('div'); el.className = 'tok';
        el.style.transition = 'none'; layer.appendChild(el);
        el.style.transform = `translate(${x}px,${y}px)`; el.style.width = m.chipW + 'px';
        void el.offsetWidth; el.style.transition = ''; pipe._tok.set(t.key, el);
      }
      el.className = 'tok t-' + t.state;
      el.textContent = PFX[t.state] + (vertical ? t.short || t.label : t.label);
      el.title = t.title || t.label;
      el.style.width = m.chipW + 'px';
      el.style.opacity = '1';
      el.style.transform = `translate(${x}px,${y}px)`;
      seen.add(t.key);
    });
  }));
  pipe._tok.forEach((el, k) => {
    if (!seen.has(k)){ pipe._tok.delete(k); el.style.opacity = '0'; setTimeout(() => el.remove(), 450); }
  });
  const sts = stageStates(toks);
  cols.forEach((c, i) => {
    c.classList.remove('s-active', 's-stalled', 's-error', 's-done');
    if (sts[i].kind) c.classList.add('s-' + sts[i].kind);
    $('.stage-state', c).textContent = sts[i].text;
  });
}
function stageStates(toks){
  return STAGES.map((_, i) => {
    const here = toks.filter(t => t.col === i);
    const bad = here.filter(t => t.state === 'rejected' || t.state === 'hazard').length;
    const stl = here.filter(t => t.state === 'stalled').length;
    const act = here.filter(t => t.state === 'processing').length;
    const ok = here.filter(t => t.state === 'completed').length;
    if (bad) return {kind:'error', text:bad + ' hazard' + (bad > 1 ? 's' : '')};
    if (stl) return {kind:'stalled', text:'Stalled ' + stl};
    if (act) return {kind:'active', text:'Active ' + act};
    if (ok) return {kind:'done', text:'Done ' + ok};
    return {kind:'', text:'Idle'};
  });
}

function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function barsSVG(cats, series, fmt, label){
  const W = 640, H = 270, m = {l:44, r:12, t:20, b:50};
  const mx = niceMax(Math.max(0, ...series.flatMap(s => s.vals)));
  const iw = W - m.l - m.r, ih = H - m.t - m.b, gw = iw / cats.length;
  const bw = Math.min(44, (gw - 26) / series.length);
  let g = '';
  for (let i = 0; i <= 4; i++){
    const y = m.t + ih - ih * i / 4;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="#e6ecf6"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${fmt(mx * i / 4)}</text>`;
  }
  cats.forEach((c, ci) => {
    const x0 = m.l + gw * ci + (gw - bw * series.length - 4 * (series.length - 1)) / 2;
    series.forEach((s, si) => {
      const v = s.vals[ci], h = ih * v / mx, x = x0 + si * (bw + 4), y = m.t + ih - h;
      g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 0)}" rx="5" fill="${s.color}"><title>${esc(s.name)}: ${esc(fmt(v))}</title></rect><text class="val" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${esc(fmt(v))}</text>`;
    });
    g += `<text x="${m.l + gw * ci + gw / 2}" y="${H - 28}" text-anchor="middle">${esc(c)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

  demo(){ if (!active().length) seedBatch(); playRun(); refresh(); },
  reset(){ resetEngine(); refresh(); toast('Simulation reset. Balances and history cleared.'); },
  'lab-run'(b){ LAB.hazard = b.dataset.h; labBuild(); const d = $('#lab-detail'); d.innerHTML = labDetailHTML(); PAGES.lab.init(); $$('.hz').forEach(c => c.classList.toggle('sel', c.dataset.h === LAB.hazard)); labPlay(); requestAnimationFrame(layoutAll); },
  'lab-play'(){ labPlay(); },
  'lab-pause'(){ labPause(); labUpdate(); },
  'lab-step'(){ labPause(); if (LAB.idx < labMax()) LAB.idx++; labUpdate(); },
  'lab-reset'(){ labPause(); LAB.idx = 0; labUpdate(); },
  filter(b){ hFilter = b.dataset.f; $$('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.f === hFilter))); histTable(); },
  export(){ exportCSV(); },
  'tx-open'(b){ openTx(b.dataset.id); },
  'modal-close'(){ closeModal(); },
  'quiz-pick'(b){ if (QZ.picked !== null) return; QZ.picked = Number(b.dataset.i); if (QZ.picked === QUIZ[QZ.i].a) QZ.score++; $('#quiz').innerHTML = quizHTML(); },
  'quiz-next'(){ if (QZ.i + 1 < QUIZ.length){ QZ.i++; QZ.picked = null; } else QZ.done = true; $('#quiz').innerHTML = quizHTML(); },
  'quiz-restart'(){ Object.assign(QZ, {i:0, score:0, picked:null, done:false}); $('#quiz').innerHTML = quizHTML(); }
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  if (e.target.id === 'scrim'){ closeNav(); return; }
  const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('#modal').hidden) closeModal(); else closeNav(); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'speed-sel'){ S.speed = SPEEDS[e.target.value] || SPEEDS.normal; if (S.running){ clearInterval(S.timer); S.timer = setInterval(tick, S.speed); } save(); }
  else if (id === 'units-sel'){ S.units = Number(e.target.value) || 2; addLog('Validation units set to ' + S.units + '.'); refresh(); save(); }
  else if (id === 'lab-speed'){ LAB.speed = Number(e.target.value) || 900; if (LAB.running) labPlay(); }
  else if (id === 'lab-units'){ LAB.units = Number(e.target.value) || 3; const keep = LAB.running; labPause(); labBuild(); $('#lab-detail').innerHTML = labDetailHTML(); PAGES.lab.init(); labUpdate(); requestAnimationFrame(layoutAll); if (keep) labPlay(); }
  else if (id === 'an-metric'){ anMetric = AN_METRICS[e.target.value] ? e.target.value : 'cycles'; $('#an-cmp').innerHTML = anCmpHTML(); }
});
document.addEventListener('input', e => { if (e.target.id === 'h-q'){ hQuery = e.target.value; histTable(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'pay-form') return;
  e.preventDefault();
  const msg = $('#f-msg');
  const res = submit({sender:$('#f-from').value, recipient:$('#f-to').value, amount:$('#f-amt').value, ref:$('#f-ref').value, scenario:$('#f-scn').value});
  if (!res.ok){ msg.className = 'form-msg err'; msg.textContent = res.error; refresh(); return; }
  msg.className = 'form-msg ok';
  msg.textContent = res.txs.length > 1 ? res.txs.length + ' payments queued (' + res.txs.map(t => t.id).join(', ') + '). Watch the pipeline.' : res.txs[0].id + ' queued. Watch it move through the pipeline.';
  playRun(); refresh();
});

/* boot */
$('#logo').innerHTML = icon('wallet', 20);
$('#menu-btn').innerHTML = icon('menu', 18);
$('#nav').innerHTML = NAV.map(n => `<a href="#/${n[0]}" data-id="${n[0]}">${icon(n[2], 18)}<span>${n[1]}</span></a>`).join('');
load();
window.addEventListener('hashchange', route);
route();
</script>
</body>
